[workspace]
resolver = "3"
members = ["skakel-client", "skakel-proto", "skakel-serial", "skakel-server", "skakel-vcam", "skakel-vcam-source", "skakel-wire"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
authors = ["Matumi Software"]
license = "MIT"
repository = "https://github.com/matumi-software/skakel"

[workspace.lints.rust]
# Every public item of a library crate says what it is for.
missing_docs = "warn"
# An unsafe fn's body is not unsafe by itself: each unsafe operation in it is marked.
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
skakel-wire = { path = "skakel-wire", version = "0.2.1" }
skakel-proto = { path = "skakel-proto", version = "0.2.1" }
skakel-vcam = { path = "skakel-vcam", version = "0.2.1" }
# Microsoft's Windows bindings (MIT OR Apache-2.0). `windows-core` is named directly because the
# `#[implement]` macro expands to paths in it.
windows = "0.62.2"
windows-core = "0.62.2"

# Wire formats and hashing. Every one is MIT or Apache-2.0 (or BSD-3-Clause for subtle,
# Apache-2.0 for unicode-general-category), checked with `cargo info` before it was added.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Constant-time comparison for secrets and fingerprints.
subtle = "2.6.1"
getrandom = "0.4.3"
base64 = "0.23.1"
# `expiresAt` in the pairing answer is an RFC 3339 timestamp.
time = { version = "0.3.55", features = ["serde-well-known", "parsing", "formatting"] }
# The Unicode categories (Cc, Cf, Zl, Zp) the discovery cleaning needs; the standard library has no Cf.
unicode-general-category = "1.1.0"

# The client (all MIT, Apache-2.0 or ISC, checked with `cargo info`, and the tree with `cargo metadata`).
skakel-serial = { path = "skakel-serial", version = "0.2.1" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = "0.7"
# Wipes a secret when it is dropped (RustCrypto; MIT or Apache-2.0, depends on nothing here).
zeroize = "1.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Which networks to probe on, and with it the IPv6 ones.
if-addrs = "0.15.0"
# UDP sockets that are IPv6 only (so one can sit beside an IPv4 socket on the same port on every
# system). MIT or Apache-2.0; tokio already builds it.
socket2 = "0.6.5"
log = "0.4"
url = "2.5.8"

# Protocol version 2's gRPC code, generated from the .proto files in `proto/` by skakel-proto's
# build script. prost (Apache-2.0) writes and reads the messages, tonic (MIT) the services, and
# protox (MIT OR Apache-2.0) compiles the .proto files in Rust, so no protoc is needed. Everything
# they pull in is MIT, Apache-2.0, Unlicense or Unicode-3.0, checked with `cargo metadata`, except
# foldhash (Zlib), which prost-build uses while it generates the code and is not built into
# anything Skakel ships. tonic takes no default features: Skakel brings its own pinned connections
# and listener, so tonic's transport and router are left out unless a crate asks for them.
prost = "0.14.4"
tonic = { version = "0.14.9", default-features = false }
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
# The `google.rpc.Status` and `ErrorInfo` a refusal carries in `grpc-status-details-bin` (MIT, same
# repository as tonic).
tonic-types = "0.14.9"
protox = "0.10.0"

# Property tests of the parsers and encoders (a dev-dependency only, MIT OR Apache-2.0). The
# default features add forking and timeouts, which the tests do not use.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
