[workspace]
resolver = "3"
members = ["skakel-client", "skakel-discovery", "skakel-pairing", "skakel-protocol", "skakel-serial", "skakel-server", "skakel-vcam", "skakel-vcam-source"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
authors = ["Matumi Software"]
license = "MIT"
repository = "https://github.com/matumi-software/skakel"

[workspace.dependencies]
skakel-protocol = { path = "skakel-protocol", version = "0.2.0" }
skakel-discovery = { path = "skakel-discovery", version = "0.2.0" }
skakel-vcam = { path = "skakel-vcam", version = "0.2.0" }
# Microsoft's Windows bindings (MIT OR Apache-2.0). `windows-core` is named directly because the
# `#[implement]` macro expands to paths in it.
windows = "0.62.2"
windows-core = "0.62.2"

# Wire formats and hashing. Every one is MIT or Apache-2.0 (or BSD-3-Clause for subtle,
# Apache-2.0 for unicode-general-category), checked with `cargo info` before it was added.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Constant-time comparison for secrets and fingerprints.
subtle = "2.6.1"
getrandom = "0.4.3"
base64 = "0.23.1"
# `expiresAt` in the pairing answer is an RFC 3339 timestamp.
time = { version = "0.3.55", features = ["serde-well-known", "parsing", "formatting"] }
# The Unicode categories (Cc, Cf, Zl, Zp) the discovery cleaning needs; the standard library has no Cf.
unicode-general-category = "1.1.0"

# The client (all MIT, Apache-2.0 or ISC, checked with `cargo info`, and the tree with `cargo metadata`).
skakel-pairing = { path = "skakel-pairing", version = "0.2.0" }
skakel-serial = { path = "skakel-serial", version = "0.2.0" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = "0.7"
# HTTP over a rustls config the client builds itself, so the certificate check is the pin.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The WebSocket framing only. The upgrade is written by hand over reqwest so a refusal keeps its body.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", features = ["sink"] }
# Which IPv4 networks to broadcast a probe on.
if-addrs = "0.15.0"
log = "0.4"
url = "2.5.8"

# Compiles the .proto files of protocol version 2 in a test, in Rust, so no protoc is needed
# (MIT OR Apache-2.0, as is everything it pulls in, checked with `cargo metadata`).
protox = "0.10.0"
