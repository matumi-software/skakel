[package]
name = "skakel-server"
description = "Serve Skakel clients: tokens, pairing approval, the control channel and data streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
skakel-protocol.workspace = true
skakel-discovery.workspace = true
skakel-pairing = { path = "../skakel-pairing", version = "0.2.0" }
skakel-proto = { workspace = true, features = ["server"] }
prost.workspace = true
tonic = { workspace = true, features = ["codegen", "router"] }
tonic-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
getrandom.workspace = true
base64.workspace = true
time.workspace = true
unicode-general-category.workspace = true

# The server stack. Every crate here, and what it pulls in, is MIT, Apache-2.0, BSD, ISC or Unicode-3.0
# (checked with `cargo metadata`). rustls runs on ring rather than aws-lc-rs, which needs a C toolchain
# with NASM on Windows. Kept in this crate, not in the workspace table, because only the server uses them.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "json"] }
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service", "http1", "http2"] }
http-body = "1.1.0"
http-body-util = "0.1.5"
# The stream a gRPC call's answers are read from.
tokio-stream = { version = "0.1.19", default-features = false }
tower-service = "0.3.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Signs the access tokens (ECDSA P-256) and checks them.
ring = "0.17.14"
# The self-signed certificate.
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
serde_urlencoded = "0.7.1"

[dev-dependencies]
# The tests call the server with the generated gRPC clients, over HTTP/2 connections of their own.
skakel-proto = { workspace = true, features = ["client"] }
tonic-prost.workspace = true
tokio = { version = "1.54.1", features = ["process", "test-util"] }
hyper = { version = "1.12.0", features = ["client", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
