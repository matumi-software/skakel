[package]
name = "skakel-client"
description = "Reach Skakel servers: discovery, pairing, tokens, the control channel and streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
skakel-protocol.workspace = true
skakel-discovery.workspace = true
skakel-pairing.workspace = true
skakel-serial.workspace = true
skakel-proto = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
prost.workspace = true
getrandom.workspace = true
tonic = { workspace = true, features = ["codegen"] }
tonic-types.workspace = true
# gRPC connections of the client's own, one TCP connection each, pinned: tonic's generated clients
# run over hyper's HTTP/2 client on a tokio-rustls stream. All of them are already in the tree
# through reqwest (MIT, MIT OR Apache-2.0).
hyper = { version = "1.12.0", features = ["client", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1.19", default-features = false }
tower-service = "0.3.3"
if-addrs.workspace = true
log.workspace = true
url.workspace = true

[dev-dependencies]
skakel-server = { path = "../skakel-server", version = "0.2.1", features = ["test-util"] }
tokio = { workspace = true, features = ["io-util"] }
# The test bench: a self-signed server of another version, a gRPC server that never answers, and
# the app's own service written the way tonic generates one.
axum = { version = "0.8.9", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
tonic-prost.workspace = true
hyper = { version = "1.12.0", features = ["server", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "service"] }
