[package]
name = "skakel-server"
description = "Serve Skakel clients: tokens, pairing approval, the control hub and data streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
skakel-protocol.workspace = true
skakel-discovery.workspace = true
skakel-pairing = { path = "../skakel-pairing", version = "0.2.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
getrandom.workspace = true
base64.workspace = true
time.workspace = true
unicode-general-category.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal", "fs"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "ws", "tokio", "query", "json"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }
hyper = "1.12.0"
tower-service = "0.3.3"
futures-util = "0.3.34"
http-body-util = "0.1.5"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ring = "0.17.14"
serde_urlencoded = "0.7.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
