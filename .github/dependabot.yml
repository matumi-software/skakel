version: 2
updates:
  - package-ecosystem: cargo
    directory: /src
    schedule:
      interval: weekly
    # windows-core has to stay at the version the `windows` crate was released with: its
    # `#[implement]` macro expands to paths in windows-core. Move both by hand, together, when a
    # `windows` release comes with a new windows-core. (windows-core 0.100.0 with windows 0.62.2
    # does not build, pull request 52.)
    ignore:
      - dependency-name: windows-core
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
