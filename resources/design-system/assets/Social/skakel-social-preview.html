<style>
:root {
  --bg-page:#161512; --text-primary:#EDEAE0; --text-secondary:#B5B0A2; --text-tertiary:#8A8578;
  --accent:#549572; --accent-subtle:#1D2B23; --attached:#5FA0A6; --attached-subtle:#1B2829; --border-default:#34322B;
}
html, body { margin:0; background:var(--bg-page); }
.card { position:relative; width:1280px; height:640px; overflow:hidden; background:var(--bg-page); font-family:'Instrument Sans', sans-serif; }
.art { position:absolute; inset:0; }
.canopy { fill:var(--accent); } .river { fill:var(--attached); } .ink { fill:var(--text-primary); }
.tint { fill:var(--accent-subtle); } .rtint { fill:var(--attached-subtle); }
.cut { fill:var(--bg-page); } .cutline { stroke:var(--bg-page); }
.text { position:absolute; left:80px; top:80px; bottom:80px; width:560px; display:flex; flex-direction:column; }
.mark { width:96px; height:96px; }
h1 { margin:auto 0 0; font:600 156px/0.9 'Instrument Sans', sans-serif; letter-spacing:-0.025em; color:var(--text-primary); }
h1 .hi { color:var(--accent); }
p { margin:28px 0 0; font-size:32px; line-height:42px; color:var(--text-secondary); max-width:540px; }
.foot { margin-top:36px; display:flex; gap:16px; align-items:center; font:400 21px/1 'JetBrains Mono', monospace; color:var(--text-tertiary); white-space:nowrap; }
.foot b { font-weight:500; color:var(--text-secondary); }
.dot { flex:none; width:6px; height:6px; border-radius:50%; background:var(--border-default); }
